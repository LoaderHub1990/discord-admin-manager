<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flexozy Key Manager</title>
<style>
:root{color-scheme:dark;--bg:#121214;--card:#1a1a1e;--in:#232327;--line:#303036;--tx:#f5f5f7;--mut:#9a9aa2;--ok:#8ce1aa;--bad:#ff7d7d;--warn:#ffcd82}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans Thai",system-ui,sans-serif;padding:20px}
.w{max-width:920px;margin:auto;display:grid;gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:grid;gap:4px;color:var(--mut);font-size:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:1px}
button{cursor:pointer}button:hover{background:#2e2e33}
button.p{background:#fff;color:#111;font-weight:700;border:0}button.p:hover{background:#e4e4e8}
button.d{color:var(--bad)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-weight:500;font-size:12px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
code{font:13px ui-monospace,Menlo,monospace}
.ok{color:var(--ok)}.bad{color:var(--bad)}.m{color:var(--mut)}
#msg{min-height:20px;color:var(--warn)}
#new{background:var(--in);border-radius:12px;padding:12px;margin:8px 0;white-space:pre-wrap;user-select:all;font:14px ui-monospace,monospace}
[hidden]{display:none!important}
</style></head><body><div class="w">
<div><h1>Flexozy Key Manager</h1><div class="m">GitHub</div></div>
<div id="msg" role="status"></div>

<div class="c"><h2>เชื่อมต่อ GitHub</h2><div class="r">
<label>Token (Contents: Read and write)<input id="tok" type="password" size="30" autocomplete="off"></label>
<label>Owner<input id="own" size="14"></label>
<label>Repo<input id="rep" size="16"></label>
<label>Branch<input id="br" size="8" value="main"></label>
<button class="p" id="sv">บันทึกและโหลด</button></div></div>

<div class="c"><h2>สร้างคีย์</h2><div class="r">
<label>ชื่อ/หมายเหตุ<input id="note" placeholder="เช่น ลูกค้า A"></label>
<label>จำนวน<input id="n" type="number" min="1" max="100" value="1" style="width:80px"></label>
<label>อายุคีย์<select id="dur">
<option value="1h">1 ชั่วโมง</option><option value="1d">1 วัน</option><option value="3d">3 วัน</option>
<option value="7d" selected>7 วัน</option><option value="30d">30 วัน</option><option value="90d">90 วัน</option>
<option value="life">ตลอดชีพ</option><option value="custom">กำหนดเอง</option></select></label>
<label id="cl" hidden>หมดอายุเมื่อ<input id="cu" type="datetime-local"></label>
<button class="p" id="mk">สร้างคีย์</button></div>
<div id="nw" hidden><div class="m" style="margin-top:12px">คีย์ใหม่ — คัดลอกเก็บไว้ได้เลย</div><div id="new"></div><button id="cp">คัดลอกทั้งหมด</button></div></div>

<div class="c"><div class="r" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">คีย์ทั้งหมด (<span id="cnt">0</span>)</h2>
<div class="r"><button id="rf">รีเฟรช</button><button class="d" id="cx">ลบคีย์ที่หมดอายุ</button></div></div>
<div class="sc"><table><thead><tr><th>หมายเหตุ</th><th>คีย์</th><th>สถานะ</th><th>หมดอายุ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="m" id="em" style="padding-top:12px">ยังไม่มีคีย์</div></div>
</div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const cfg=JSON.parse(LS.cfg||'{}'),gh=location.hostname.match(/^(.+)\.github\.io$/);
if(gh){cfg.owner=cfg.owner||gh[1];cfg.repo=cfg.repo||location.pathname.split('/')[1]||gh[1]+'.github.io'}
cfg.branch=cfg.branch||'main';
$('#tok').value=cfg.token||'';$('#own').value=cfg.owner||'';$('#rep').value=cfg.repo||'';$('#br').value=cfg.branch;
let db={keys:[]},sha=null;
const vault=()=>JSON.parse(LS.vault||'{}'),now=()=>Math.floor(Date.now()/1000);
const sha256=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',g4=()=>[...crypto.getRandomValues(new Uint8Array(4))].map(x=>AL[x%32]).join('');
const gen=()=>`FLEXOZY1DEY-${g4()}-${g4()}-${g4()}`;
const D={'1h':3600,'1d':86400,'3d':259200,'7d':604800,'30d':2592000,'90d':7776000};
function expFrom(v){if(v==='life')return 0;if(v==='custom'){const t=Date.parse($('#cu').value);if(!t)throw Error('เลือกวันเวลาหมดอายุก่อน');return Math.floor(t/1000)}return now()+D[v]}
function left(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} วัน ${h} ชม.`:h?`${h} ชม. ${m} นาที`:`${m} นาที`}
const say=(t,bad)=>{$('#msg').textContent=t||'';$('#msg').style.color=bad?'var(--bad)':'var(--warn)'};
const H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
const U=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/keys.json`;
async function load(){
 const r=await fetch(`${U()}?ref=${cfg.branch}&t=${Date.now()}`,{headers:H()});
 if(r.status===404){db={keys:[]};sha=null;return}
 if(!r.ok)throw Error(`เชื่อมต่อ GitHub ไม่ได้ (${r.status}) ตรวจ token / owner / repo`);
 const j=await r.json();sha=j.sha;
 db=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))));
 db.keys=db.keys||[];
}
async function save(msg){
 const content=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(db,null,1))));
 const r=await fetch(U(),{method:'PUT',headers:H(),body:JSON.stringify({message:msg,content,branch:cfg.branch,...(sha?{sha}:{})})});
 if(!r.ok)throw Error(`บันทึกไม่สำเร็จ (${r.status}) token ต้องมีสิทธิ์ Contents: Read and write`);
 sha=(await r.json()).content.sha;
}
async function mutate(msg,fn){
 try{say('กำลังบันทึก...');await load();await fn();await save(msg);say('บันทึกแล้ว — เกมจะเห็นการเปลี่ยนแปลงภายใน 1–5 นาที');render()}
 catch(e){say(e.message,1)}
}
function render(){
 const v=vault(),t=now(),ks=[...db.keys].sort((a,b)=>b.created-a.created);
 $('#cnt').textContent=ks.length;$('#em').hidden=ks.length>0;
 $('#tb').innerHTML=ks.map(k=>{
  const life=!k.exp,ex=!life&&k.exp<=t,key=v[k.hash];
  const st=life?'<span class="ok">ตลอดชีพ</span>':ex?'<span class="bad">หมดอายุ</span>':`<span class="ok">เหลือ ${left(k.exp-t)}</span>`;
  const when=life?'-':new Date(k.exp*1000).toLocaleString('th-TH');
  return `<tr><td>${(k.note||'-').replace(/[<>&]/g,'')}</td><td>${key?`<code>${key}</code>`:`<span class="m">ซ่อน (${k.hash.slice(0,8)})</span>`}</td><td>${st}</td><td>${when}</td>
  <td>${key?`<button data-a="cp" data-h="${k.hash}">คัดลอก</button> `:''}<button data-a="ed" data-h="${k.hash}">แก้เวลา</button> <button class="d" data-a="rm" data-h="${k.hash}">ลบ</button></td></tr>`}).join('');
}
$('#dur').onchange=()=>$('#cl').hidden=$('#dur').value!=='custom';
$('#sv').onclick=async()=>{
 Object.assign(cfg,{token:$('#tok').value.trim(),owner:$('#own').value.trim(),repo:$('#rep').value.trim(),branch:$('#br').value.trim()||'main'});
 LS.cfg=JSON.stringify(cfg);
 try{say('กำลังโหลด...');await load();say('เชื่อมต่อสำเร็จ');render()}catch(e){say(e.message,1)}
};
$('#rf').onclick=async()=>{try{await load();say('');render()}catch(e){say(e.message,1)}};
$('#mk').onclick=()=>mutate('add keys',async()=>{
 const n=Math.min(100,Math.max(1,+$('#n').value||1)),exp=expFrom($('#dur').value),note=$('#note').value.trim(),v=vault(),out=[];
 for(let i=0;i<n;i++){const k=gen(),h=await sha256(k);db.keys.push({hash:h,note,exp,created:now()});v[h]=k;out.push(k)}
 LS.vault=JSON.stringify(v);$('#new').textContent=out.join('\n');$('#nw').hidden=false;
});
$('#cp').onclick=()=>navigator.clipboard.writeText($('#new').textContent).then(()=>say('คัดลอกแล้ว'));
$('#cx').onclick=()=>confirm('ลบคีย์ที่หมดอายุทั้งหมด?')&&mutate('remove expired',()=>{db.keys=db.keys.filter(k=>!k.exp||k.exp>now())});
$('#tb').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const h=b.dataset.h;
 if(b.dataset.a==='cp')navigator.clipboard.writeText(vault()[h]).then(()=>say('คัดลอกแล้ว'));
 if(b.dataset.a==='rm'&&confirm('ลบคีย์นี้?'))mutate('delete key',()=>{db.keys=db.keys.filter(k=>k.hash!==h)});
 if(b.dataset.a==='ed'){const d=prompt('ตั้งอายุใหม่นับจากตอนนี้ (จำนวนวัน, ใส่ 0 = ตลอดชีพ)','30');if(d===null)return;const n=+d;if(isNaN(n)||n<0)return say('ใส่ตัวเลขวัน',1);
  mutate('edit time',()=>{const k=db.keys.find(k=>k.hash===h);if(k)k.exp=n?now()+Math.round(n*86400):0})}
};
if(cfg.token&&cfg.owner&&cfg.repo)$('#sv').click();
setInterval(render,30000);
</script></body></html>
